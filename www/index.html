<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="description" content="薄计划：12 周减脂留线条。每天练什么、外卖点什么、体重怎么调，一页说清。">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="薄计划">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>薄计划 · 12 周减脂留线条</title>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">薄</div>
        <div class="brand-copy">
          <strong>薄计划</strong>
          <span>12 周 · 减脂留线条</span>
        </div>
      </div>
      <div class="top-meta">
        <span class="week-pill" id="weekPill">第 1 周</span>
        <span class="today-text" id="dateText">--</span>
      </div>
    </header>

    <main id="main">
      <section class="view active" id="view-today" aria-label="今日"></section>
      <section class="view" id="view-plan" aria-label="计划"></section>
      <section class="view" id="view-takeout" aria-label="外卖"></section>
      <section class="view" id="view-data" aria-label="数据"></section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button class="tab active" type="button" data-view="today" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <span>今日</span>
      </button>
      <button class="tab" type="button" data-view="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18M8 14h.01M12 14h.01M16 14h.01M8 18h.01M12 18h.01"/></svg>
        <span>计划</span>
      </button>
      <button class="tab" type="button" data-view="takeout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11h16M5 11a7 7 0 0 1 14 0M3 11h18v2a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7v-2Z"/><path d="M9 7c0-1 .5-2 1.5-2.5"/></svg>
        <span>外卖</span>
      </button>
      <button class="tab" type="button" data-view="data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/><path d="m4 7 6-4 6 5 5-5"/></svg>
        <span>数据</span>
      </button>
    </nav>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
